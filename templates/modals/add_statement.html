{% extends "modals/base_modal.html" %}
{% block modal_content %}
<form id="add-statement-form" class="add-form" method="POST" action="{{ url_for('create_statement') }}">
    <input type="hidden" name="topic_id" value="{{ topic.id }}">
    <h3 id="{{ modal_id }}-title">Add New Statement</h3>
    <div class="form-group">
        <label for="statement-text">Statement</label>
        <textarea id="statement-text" name="text" required></textarea>
    </div>
    <div class="form-actions">
        <button type="submit" class="btn-primary">Add Statement</button>
        <button type="button" class="btn-secondary" onclick="closeModal('{{ modal_id }}')">Cancel</button>
    </div>
</form>
{% endblock %}
