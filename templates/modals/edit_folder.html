{% extends "modals/base_modal.html" %}
{% block modal_content %}
<form id="edit-folder-form-{{ folder_id }}" method="POST" action="{{ url_for('update_folder') }}">
    <input type="hidden" name="folder_id" value="{{ folder_id }}">
    <h3 id="{{ modal_id }}-title">Edit Folder</h3>
    <div class="form-group">
        <label for="edit-folder-name-{{ folder_id }}">Folder Name</label>
        <input type="text" id="edit-folder-name-{{ folder_id }}" name="name" value="{{ current_name|e }}" required>
    </div>
    <div class="form-group">
        <label for="edit-folder-desc-{{ folder_id }}">Description</label>
        <textarea id="edit-folder-desc-{{ folder_id }}" name="description">{{ current_description }}</textarea>
    </div>
    <div class="form-actions">
        <button type="submit" class="btn-primary">Save Changes</button>
        <button type="button" class="btn-secondary" onclick="closeModal('{{ modal_id }}')">Cancel</button>
    </div>
</form>
{% endblock %}
