{% extends "modals/base_modal.html" %}
{% block modal_content %}
<form id="move-topic-form" class="add-form" method="POST" action="{{ url_for('move_topic') }}">
    <input type="hidden" name="topic_id" value="{{ topic_id }}">
    <h3 id="{{ modal_id }}-title">Move Topic</h3>
    <div class="form-group">
        <label for="{{ modal_id }}-folder">Folder</label>
        <select id="{{ modal_id }}-folder" name="folder_id">
            <option value="">No folder (loose in domain)</option>
            {% for f in all_folders %}
            <option value="{{ f.id }}" {% if f.id == current_folder_id %}selected{% endif %}>{{ f.indent | safe }}{{ f.name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-actions">
        <button type="submit" class="btn-primary">Move</button>
        <button type="button" class="btn-secondary" onclick="closeModal('{{ modal_id }}')">Cancel</button>
    </div>
</form>
{% endblock %}
