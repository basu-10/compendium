{% extends "modals/base_modal.html" %}
{% block modal_content %}
<form id="edit-statement-form-{{ statement_id }}" method="POST" action="{{ url_for('update_statement') }}">
    <input type="hidden" name="statement_id" value="{{ statement_id }}">
    <h3 id="{{ modal_id }}-title">Edit Statement</h3>
    <div class="form-group">
        <label for="edit-text-{{ statement_id }}">Statement</label>
        <textarea id="edit-text-{{ statement_id }}" name="text" required>{{ current_text }}</textarea>
    </div>
    <div class="form-actions">
        <button type="submit" class="btn-primary">Save Changes</button>
        <button type="button" class="btn-secondary" onclick="closeModal('{{ modal_id }}')">Cancel</button>
    </div>
</form>
{% endblock %}
