{% extends "modals/base_modal.html" %}
{% block modal_content %}
<form id="edit-domain-form-{{ domain_id }}" method="POST" action="{{ url_for('update_domain') }}">
    <input type="hidden" name="domain_id" value="{{ domain_id }}">
    <h3 id="{{ modal_id }}-title">Edit Domain</h3>
    <div class="form-group">
        <label for="edit-name-{{ domain_id }}">Domain Name</label>
        <input type="text" id="edit-name-{{ domain_id }}" name="name" value="{{ current_name|e }}" required>
    </div>
    <div class="form-group">
        <label for="edit-desc-{{ domain_id }}">Description</label>
        <textarea id="edit-desc-{{ domain_id }}" name="description">{{ current_description }}</textarea>
    </div>
    <div class="form-actions">
        <button type="submit" class="btn-primary">Save Changes</button>
        <button type="button" class="btn-secondary" onclick="closeModal('{{ modal_id }}')">Cancel</button>
    </div>
</form>
{% endblock %}
