{# Base modal structure with consistent styling #}
<div class="modal-overlay" id="{{ modal_id }}" role="dialog" aria-modal="true" aria-labelledby="{{ modal_id }}-title">
    <div class="modal-content" role="document" onclick="event.stopPropagation()">
        <button class="modal-icon-btn close-modal" onclick="closeModal('{{ modal_id }}')" aria-label="Close modal">&times;</button>
        {% block modal_content %}{% endblock %}
    </div>
</div>
