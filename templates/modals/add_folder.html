{% extends "modals/base_modal.html" %}
{% block modal_content %}
<form id="add-folder-form-{{ modal_id }}" class="add-form" method="POST" action="{{ url_for('create_folder') }}">
    <input type="hidden" name="domain_id" value="{{ domain_id }}">
    <input type="hidden" name="parent_id" value="{{ parent_id or '' }}">
    <h3 id="{{ modal_id }}-title">{{ title or 'New Folder' }}</h3>
    <div class="form-group">
        <label for="folder-name-{{ modal_id }}">Folder Name</label>
        <input type="text" id="folder-name-{{ modal_id }}" name="name" required>
    </div>
    <div class="form-group">
        <label for="folder-desc-{{ modal_id }}">Description (optional)</label>
        <textarea id="folder-desc-{{ modal_id }}" name="description"></textarea>
    </div>
    <div class="form-group checkbox-group">
        <input type="checkbox" id="folder-public-{{ modal_id }}" name="is_public">
        <label for="folder-public-{{ modal_id }}">Make this folder public</label>
    </div>
    <div class="form-actions">
        <button type="submit" class="btn-primary">Create Folder</button>
        <button type="button" class="btn-secondary" onclick="closeModal('{{ modal_id }}')">Cancel</button>
    </div>
</form>
{% endblock %}
