{% extends "modals/base_modal.html" %}
{% block modal_content %}
<form id="attach-form-{{ statement_id }}" class="add-form" method="POST" action="{{ url_for('create_attachment') }}" enctype="multipart/form-data">
    <input type="hidden" name="statement_id" value="{{ statement_id }}">
    <h3 id="{{ modal_id }}-title">{{ title or 'Attach Asset' }}</h3>
    <p class="modal-hint">Pick how you want to add this asset &mdash; paste text/URL or upload a file. The type is detected automatically.</p>

    <div class="form-group">
        <label for="att-title-{{ statement_id }}">Title <span class="optional">(optional)</span></label>
        <input type="text" id="att-title-{{ statement_id }}" name="title" placeholder="Leave blank to use the file name">
    </div>

    <div class="attach-tabs" role="tablist" aria-label="Asset input method">
        <button type="button" class="attach-tab active" role="tab" aria-selected="true"
                id="tab-paste-{{ statement_id }}" aria-controls="panel-paste-{{ statement_id }}"
                data-tab="paste">Paste Text / URL</button>
        <button type="button" class="attach-tab" role="tab" aria-selected="false"
                id="tab-upload-{{ statement_id }}" aria-controls="panel-upload-{{ statement_id }}"
                data-tab="upload">Upload File</button>
        <button type="button" class="attach-tab" role="tab" aria-selected="false"
                id="tab-scrape-{{ statement_id }}" aria-controls="panel-scrape-{{ statement_id }}"
                data-tab="scrape">Scrape URL</button>
    </div>

    <div class="attach-tab-panel active" id="panel-paste-{{ statement_id }}" role="tabpanel"
         aria-labelledby="tab-paste-{{ statement_id }}">
        <div class="form-group">
            <label>Content <span class="optional">(optional)</span></label>

            <div class="paste-mode-toggle" role="group" aria-label="Paste mode">
                <button type="button" class="paste-mode-btn active" data-mode="text" aria-pressed="true">Text</button>
                <button type="button" class="paste-mode-btn" data-mode="url" aria-pressed="false">URL</button>
            </div>

            <div class="paste-text-mode">
                <div class="rich-editor-host" id="att-rich-editor-{{ statement_id }}"></div>
                <textarea id="att-content-hidden-{{ statement_id }}" name="content" style="display:none"></textarea>
            </div>

            <div class="paste-url-mode" hidden>
                <input type="url" id="att-content-url-{{ statement_id }}" name="content_url"
                       placeholder="https://example.com/article">
            </div>

            <div class="split-paste-btn">
                <button type="button" class="paste-icon-btn" title="Paste with formatting" aria-label="Paste with formatting">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18" aria-hidden="true"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
                </button>
                <button type="button" class="paste-dropdown-trigger" title="Paste options" aria-label="Paste options" aria-haspopup="true" aria-expanded="false">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
                </button>
                <div class="paste-dropdown-menu" role="menu">
                    <button type="button" class="paste-dropdown-item" data-paste-action="plain" role="menuitem">Paste as plain text</button>
                </div>
            </div>

            <span class="form-hint paste-form-hint">Rich text note — formatting preserved.</span>
        </div>
    </div>

    <div class="attach-tab-panel" id="panel-upload-{{ statement_id }}" role="tabpanel"
         aria-labelledby="tab-upload-{{ statement_id }}" hidden>
        <div class="form-group drop-or-upload">
            <label for="att-file-{{ statement_id }}">Upload <span class="optional">(optional)</span></label>
            <input type="file" id="att-file-{{ statement_id }}" name="file">
            <span class="file-hint" id="file-hint-{{ statement_id }}"></span>
        </div>
    </div>

    <div class="attach-tab-panel" id="panel-scrape-{{ statement_id }}" role="tabpanel"
         aria-labelledby="tab-scrape-{{ statement_id }}" hidden>
        <div class="form-group">
            <label for="att-scrape-url-{{ statement_id }}">Page URL</label>
            <div class="scrape-row">
                <input type="url" id="att-scrape-url-{{ statement_id }}" name="scrape_url"
                       placeholder="https://example.com/article">
                <button type="button" class="btn-secondary" id="scrape-btn-{{ statement_id }}">Get Content</button>
            </div>
            <span class="file-hint" id="scrape-status-{{ statement_id }}"></span>
        </div>
    </div>

    <div class="form-group">
        <label for="att-tags-{{ statement_id }}">Tags <span class="optional">(optional)</span></label>
        <input type="text" id="att-tags-{{ statement_id }}" name="tags" placeholder="comma, separated">
    </div>

    <div class="form-actions">
        <button type="submit" class="btn-primary">Add Asset</button>
        <button type="button" class="btn-secondary" onclick="closeModal('{{ modal_id }}')">Cancel</button>
    </div>
</form>

<script type="module">
import { initAttachModal } from '/static/js/modals/attach-modal.js';

const root = document.getElementById('{{ modal_id }}');
if (root) {
    initAttachModal(root, '{{ statement_id }}');
}
</script>
{% endblock %}
