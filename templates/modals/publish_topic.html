{% extends "modals/base_modal.html" %}
{% block modal_content %}
<form id="publish-topic-form-{{ modal_id }}" class="add-form" method="POST" action="{{ url_for('publish_topic', topic_id=topic_id) }}">
    <h3 id="{{ modal_id }}-title">Publish Topic</h3>
    <p class="modal-hint">Publishing makes this topic visible to everyone. Choose the domain to publish into.</p>
    <div class="form-group">
        <label for="{{ modal_id }}-domain">Publish into domain</label>
        <select id="{{ modal_id }}-domain" name="domain_id" required>
            <option value="">Choose a domain…</option>
            {% for d in all_domains %}
            <option value="{{ d.id }}">{{ d.name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-actions">
        <button type="submit" class="btn-primary">Publish</button>
        <button type="button" class="btn-secondary" onclick="closeModal('{{ modal_id }}')">Cancel</button>
    </div>
</form>
{% endblock %}
