{% extends "modals/base_modal.html" %}
{% block modal_content %}
<form id="add-topic-form" class="add-form" method="POST" action="{{ url_for('create_topic') }}">
    <input type="hidden" name="domain_id" value="{{ domain.id }}">
    <h3 id="{{ modal_id }}-title">Add New Topic</h3>
    <div class="form-group">
        <label for="topic-name">Topic Name</label>
        <input type="text" id="topic-name" name="name" required>
    </div>
    <div class="form-group">
        <label for="topic-desc">Description (optional)</label>
        <textarea id="topic-desc" name="description"></textarea>
    </div>
    <div class="form-actions">
        <button type="submit" class="btn-primary">Create Topic</button>
        <button type="button" class="btn-secondary" onclick="closeModal('{{ modal_id }}')">Cancel</button>
    </div>
</form>
{% endblock %}
