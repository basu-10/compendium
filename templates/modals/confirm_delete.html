{% extends "modals/base_modal.html" %}
{% block modal_content %}
<div class="confirm-modal">
    <h3 id="{{ modal_id }}-title">{{ title or 'Confirm Deletion' }}</h3>
    <p>{{ message or 'Are you sure you want to delete this item? This action cannot be undone.' }}</p>
    <div class="confirm-actions">
        <form method="POST" action="{{ delete_url }}" style="display: inline;">
            <button type="submit" class="btn-danger">Delete</button>
        </form>
        <button type="button" class="btn-secondary" onclick="closeModal('{{ modal_id }}')">Cancel</button>
    </div>
</div>
{% endblock %}
