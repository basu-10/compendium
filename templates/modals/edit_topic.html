{% extends "modals/base_modal.html" %}
{% block modal_content %}
<form id="edit-topic-form-{{ topic_id }}" method="POST" action="{{ url_for('update_topic') }}">
    <input type="hidden" name="topic_id" value="{{ topic_id }}">
    <h3 id="{{ modal_id }}-title">Edit Topic</h3>
    <div class="form-group">
        <label for="edit-name-{{ topic_id }}">Topic Name</label>
        <input type="text" id="edit-name-{{ topic_id }}" name="name" value="{{ current_name|e }}" required>
    </div>
    <div class="form-group">
        <label for="edit-desc-{{ topic_id }}">Description</label>
        <textarea id="edit-desc-{{ topic_id }}" name="description">{{ current_description }}</textarea>
    </div>
    <label class="checkbox-row">
        <input type="checkbox" name="is_public" id="edit-public-{{ topic_id }}" {% if current_is_public %}checked{% endif %}>
        Make this topic public (visible to anyone without login)
    </label>
    <div class="form-actions">
        <button type="submit" class="btn-primary">Save Changes</button>
        <button type="button" class="btn-secondary" onclick="closeModal('{{ modal_id }}')">Cancel</button>
    </div>
</form>
{% endblock %}
